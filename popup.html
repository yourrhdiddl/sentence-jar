<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sentence Jar</title>
  <style>
    :root {
      --bg-1: #1a1035;
      --bg-2: #0f1a3a;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.14);
      --glass-hover: rgba(255, 255, 255, 0.16);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shine: rgba(255, 255, 255, 0.35);
      --text: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.72);
      --text-faint: rgba(255, 255, 255, 0.5);
      --accent: #c4b5fd;
      --mark: rgba(236, 72, 153, 0.38);
      --danger: #fda4af;
      --danger-bg: rgba(244, 63, 94, 0.22);
      --shadow: 0 8px 32px rgba(8, 4, 30, 0.35);
      --line: rgba(255, 255, 255, 0.1);
      --focus: rgba(196, 181, 253, 0.6);
      --scroll: rgba(255, 255, 255, 0.2);
      --glow-1: rgba(139, 92, 246, 0.55);
      --glow-1-soft: rgba(139, 92, 246, 0.18);
      --glow-2: rgba(236, 72, 153, 0.45);
      --glow-2-soft: rgba(236, 72, 153, 0.15);
      --glow-3: rgba(6, 182, 212, 0.32);
      --glow-3-soft: rgba(6, 182, 212, 0.1);
      --toast: rgba(40, 30, 80, 0.85);
      --dialog: rgba(40, 30, 80, 0.75);
      --scrim: rgba(10, 6, 30, 0.55);
      --radius: 16px;
      --pad: 16px;   /* 화면 가장자리 여백 */
      --gap: 12px;   /* 덩어리 사이 간격 */
      color-scheme: dark;
    }

    /* 라이트 모드: 밝은 파스텔 배경 위의 흰 유리 */
    :root[data-theme="light"] {
      --bg-1: #f6f3ff;
      --bg-2: #eef5ff;
      --glass: rgba(255, 255, 255, 0.55);
      --glass-strong: rgba(255, 255, 255, 0.75);
      --glass-hover: rgba(255, 255, 255, 0.8);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shine: rgba(255, 255, 255, 0.9);
      --text: #1e1b4b;
      --text-sub: rgba(30, 27, 75, 0.7);
      --text-faint: rgba(30, 27, 75, 0.55);
      --accent: #7c3aed;
      --mark: rgba(236, 72, 153, 0.22);
      --danger: #be123c;
      --danger-bg: rgba(225, 29, 72, 0.12);
      --shadow: 0 8px 32px rgba(76, 29, 149, 0.12);
      --line: rgba(30, 27, 75, 0.08);
      --focus: rgba(124, 58, 237, 0.45);
      --scroll: rgba(30, 27, 75, 0.18);
      --glow-1: rgba(167, 139, 250, 0.5);
      --glow-1-soft: rgba(167, 139, 250, 0.16);
      --glow-2: rgba(244, 114, 182, 0.4);
      --glow-2-soft: rgba(244, 114, 182, 0.12);
      --glow-3: rgba(56, 189, 248, 0.35);
      --glow-3-soft: rgba(56, 189, 248, 0.1);
      --toast: rgba(255, 255, 255, 0.92);
      --dialog: rgba(255, 255, 255, 0.88);
      --scrim: rgba(30, 27, 75, 0.25);
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      position: relative;
      width: 380px;
      min-height: 220px;
      overflow: hidden;
      font-family: "Pretendard", system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      background:
        radial-gradient(120% 90% at 0% 0%, var(--glow-1) 0%, var(--glow-1-soft) 45%, transparent 75%),
        radial-gradient(110% 80% at 100% 45%, var(--glow-2) 0%, var(--glow-2-soft) 45%, transparent 75%),
        radial-gradient(120% 90% at 15% 100%, var(--glow-3) 0%, var(--glow-3-soft) 45%, transparent 75%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      -webkit-font-smoothing: antialiased;
      transition: color .25s;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    svg { display: block; }

    .app { position: relative; z-index: 1; }

    /* 유리 공통 */
    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow), inset 0 1px 0 var(--glass-shine);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
    }

    /* 머리말 */
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: var(--pad) var(--pad) 0;
    }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--gap);
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .logo {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 11px;
      color: var(--text);
    }
    .title-tools { display: flex; align-items: center; gap: 8px; }
    .count {
      padding: 3px 10px;
      border-radius: 999px;
      color: var(--text-sub);
      font-size: 11.5px;
      font-weight: 600;
    }
    .search { position: relative; display: block; }
    .search svg {
      position: absolute;
      left: 13px;
      top: 50%;
      z-index: 1;
      transform: translateY(-50%);
      color: var(--text-sub);
      pointer-events: none;
    }
    #search {
      width: 100%;
      height: 40px;
      padding: 0 14px 0 38px;
      border-radius: 12px;
      color: var(--text);
      font: inherit;
      outline: none;
      box-shadow: inset 0 1px 0 var(--glass-shine);
      transition: border-color .2s, background .2s;
    }
    #search::placeholder { color: var(--text-faint); }
    #search:focus { border-color: var(--focus); background: var(--glass-strong); }
    #search::-webkit-search-cancel-button { opacity: .6; }

    /* 목록 */
    #list {
      list-style: none;
      margin: 0;
      margin-bottom: var(--gap);
      /* 스크롤바(6px) 자리를 늘 비워 두고, 그만큼 오른쪽 여백을 줄여 좌우 여백을 같게 맞춘다 */
      padding: var(--gap) calc(var(--pad) - 6px) 0 var(--pad);
      max-height: 400px;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 6px; }

    .item {
      padding: 14px;
      border-radius: var(--radius);
      transition: background .2s, transform .2s;
    }
    .item + .item { margin-top: var(--gap); }
    .item:hover { background: var(--glass-hover); transform: translateY(-1px); }
    .text {
      margin: 0 0 var(--gap);
      font-size: 13.5px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .text::before {
      content: "\201C";
      margin-right: 2px;
      color: var(--accent);
      font-weight: 700;
    }
    .text::after {
      content: "\201D";
      margin-left: 2px;
      color: var(--accent);
      font-weight: 700;
    }
    .text mark {
      background: var(--mark);
      color: inherit;
      border-radius: 4px;
      padding: 0 2px;
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
      padding-top: var(--gap);
      border-top: 1px solid var(--line);
    }
    .source {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--text-faint);
      font-size: 11.5px;
      text-decoration: none;
    }
    .source span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.source:hover { color: var(--accent); }
    .dot { flex: none; }

    .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .2s; }
    .item:hover .actions,
    .item:focus-within .actions { opacity: 1; }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--text-sub);
      transition: background .2s, color .2s, border-color .2s;
    }
    .icon-btn:hover { background: var(--glass-strong); border-color: var(--glass-border); color: var(--text); }
    .icon-btn.delete:hover { background: var(--danger-bg); color: var(--danger); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* 테마 전환 버튼: 지금 테마의 반대쪽 아이콘만 보인다 */
    #themeBtn { width: 30px; height: 30px; border-radius: 10px; color: var(--text); }
    #themeBtn .icon-moon { display: none; }
    :root[data-theme="light"] #themeBtn .icon-sun { display: none; }
    :root[data-theme="light"] #themeBtn .icon-moon { display: block; }

    /* 비어 있을 때 */
    .empty {
      margin: var(--gap) var(--pad);
      padding: 28px var(--pad);
      border-radius: var(--radius);
      text-align: center;
      color: var(--text-sub);
    }
    .empty-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto var(--gap);
      border-radius: 16px;
      color: var(--text);
    }
    .empty strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 15px; }
    .empty p { margin: 0; font-size: 12.5px; line-height: 1.8; }
    .empty .tip {
      display: block;
      margin-top: var(--gap);
      padding-top: var(--gap);
      border-top: 1px solid var(--line);
      color: var(--text-faint);
      font-size: 11.5px;
      line-height: 1.6;
    }
    .empty .tip b { color: var(--accent); }
    .empty kbd {
      padding: 2px 7px;
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      background: var(--glass-strong);
      color: var(--text);
      font: inherit;
      font-size: 11.5px;
    }

    /* 바닥글 */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 var(--pad) 8px;
      padding: 6px 6px 6px 14px;
      border-radius: 12px;
      color: var(--text-faint);
      font-size: 11.5px;
    }
    footer .lock { display: flex; align-items: center; gap: 6px; }
    #clearAll {
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text-sub);
      font-size: 11.5px;
      transition: background .2s, color .2s;
    }
    #clearAll:hover:not(:disabled) { background: var(--danger-bg); color: var(--danger); }
    #clearAll:disabled { opacity: .35; cursor: default; }

    /* 버전 표시와 만든 사람 */
    .ver {
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-faint);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .brand {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 0 var(--pad) var(--pad);
      color: var(--text-faint);
      font-size: 11px;
    }
    .brand b { color: var(--text-sub); font-weight: 600; }
    .brand a { color: var(--text-sub); text-decoration: none; }
    .brand a:hover { color: var(--accent); text-decoration: underline; }

    /* 알림 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 64px;
      z-index: 3;
      transform: translate(-50%, 10px);
      padding: 8px 16px;
      border-radius: 999px;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--toast);
      white-space: nowrap;
    }
    .toast.has-action { padding: 5px 6px 5px 16px; }
    .toast.show.has-action { pointer-events: auto; }
    .toast-action {
      padding: 4px 10px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--glass-strong);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }
    .toast-action:hover { background: var(--glass-hover); }
    .toast-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* 확인 창 */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--scrim);
    }
    .scrim[hidden] { display: none; }
    .dialog {
      width: 100%;
      padding: 20px;
      border-radius: var(--radius);
      background: var(--dialog);
    }
    .dialog strong { display: block; margin-bottom: 6px; font-size: 15px; }
    .dialog p { margin: 0 0 16px; color: var(--text-sub); font-size: 12.5px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn {
      height: 36px;
      padding: 0 14px;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      background: var(--glass);
      color: var(--text);
      font-weight: 600;
    }
    .btn:hover { background: var(--glass-strong); }
    .btn.danger { border-color: transparent; background: #e11d48; color: #ffffff; }
    .btn.danger:hover { background: #be123c; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <h1>
          <span class="logo glass" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M4.6 17.8C3.6 16.7 3 15.5 3 13.5c0-3.5 2.5-6.6 6-8.2l.9 1.4C6.6 8.5 6 10.8 6.2 12.2c.4-.2 1-.3 1.6-.2 1.8.2 3.2 1.6 3.2 3.4a3.5 3.5 0 0 1-3.5 3.5c-1.1 0-2.2-.5-2.9-1.1Zm10 0c-1-1.1-1.6-2.3-1.6-4.3 0-3.5 2.5-6.6 6-8.2l.9 1.4c-3.3 1.8-4 4.1-3.7 5.5.4-.2 1-.3 1.6-.2 1.8.2 3.2 1.6 3.2 3.4a3.5 3.5 0 0 1-3.5 3.5c-1.1 0-2.2-.5-2.9-1.1Z"/></svg>
          </span>
          Sentence Jar
          <span class="ver" id="version">v1.0.0</span>
        </h1>
        <div class="title-tools">
          <span class="count glass" id="count">0</span>
          <button class="icon-btn glass" id="themeBtn" type="button" aria-label="Switch to light mode" title="Switch to light mode">
            <!-- 다크 모드일 때 보이는 해 아이콘 -->
            <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <!-- 라이트 모드일 때 보이는 달 아이콘 -->
            <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
          </button>
        </div>
      </div>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" class="glass" type="search" placeholder="Search your sentences" autocomplete="off">
      </label>
    </header>

    <ul id="list"></ul>
    <div class="empty glass" id="empty" hidden>
      <div class="empty-icon glass" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14.5"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/><path d="M8 7h8M8 11h6"/></svg>
      </div>
      <strong id="emptyTitle"></strong>
      <p id="emptyText"></p>
    </div>

    <footer class="glass">
      <span class="lock">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Stored only on this device
      </span>
      <button id="clearAll">Clear all</button>
    </footer>
    <p class="brand">
      <span>by <b>yourrhdiddl</b></span>
      <span aria-hidden="true">·</span>
      <a href="mailto:yourrhdiddl@gmail.com" target="_blank" rel="noopener">yourrhdiddl@gmail.com</a>
    </p>
  </div>

  <div class="toast glass" id="toast" role="status"></div>

  <!-- 모두 지우기 확인 창 -->
  <div class="scrim" id="confirm" hidden>
    <div class="dialog glass" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <strong id="confirmTitle"></strong>
      <p id="confirmText">This cannot be undone.</p>
      <div class="dialog-actions">
        <button class="btn" id="confirmCancel" type="button">Cancel</button>
        <button class="btn danger" id="confirmOk" type="button">Delete all</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
